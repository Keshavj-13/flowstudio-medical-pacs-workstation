<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlowStudio PACS • Precision Multi-Organ Workstation</title>
  
  <!-- Typography: High-legibility system sans and monospace fallback -->
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="/static/css/clinical_pacs.css">
  
  <!-- JavaScript Dependencies (Local HTMX & Three.js) -->
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/three.min.js"></script>
  <link rel="stylesheet" href="/static/css/readability.css?v=20261111-viewer-layout">
</head>
<body>
  <div class="pacs-app-container">
    <!-- Clinical Top Navigation Bar -->
    <header class="pacs-header">
      <div class="brand-section">
        <div class="brand-logo-badge">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="4" />
            <path d="M12 6v12M6 12h12" />
          </svg>
        </div>
        <div class="brand-text-wrap">
          <div class="brand-title">
            FLOWSTUDIO PACS
            <span class="brand-badge">CICE-BEATNET v6.0</span>
          </div>
          <div class="brand-sub">Multi-Organ Foundation 3D UNet Workstation</div>
        </div>
      </div>

      <div class="header-center-info">
        <div class="header-stat">
          <span class="dot"></span>
          <span>Viewer online · models checked on scan</span>
        </div>
        <div class="header-stat">
          <span style="color: var(--text-muted);">|</span>
        </div>
        <div class="header-stat">
          <span>COHORTS: BRAIN · SPLEEN · PROSTATE · PAN-BODY · BREAST</span>
        </div>
      </div>

      <div class="header-actions">
        <button class="dock-btn" onclick="toggleSidebar()" id="sidebar-toggle-btn">
          Cohorts Drawer
        </button>
      </div>
    </header>

    <!-- Main PACS Workspace Area -->
    <div class="pacs-workspace" id="pacs-workspace">
      <!-- Cohort Drawer Floating Island -->
      <aside class="pacs-sidebar" id="cohort-sidebar">
        {% include "cohort_drawer.html" %}
      </aside>

      <!-- Collapsed Cohort Trigger -->
      <button class="cohort-open-trigger" id="cohort-open-trigger" onclick="toggleSidebar()" style="display: none;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6" />
        </svg>
        <span>Cohorts</span>
      </button>

      <!-- Main Stage (Loads Active Case) -->
      <main class="main-stage" id="main-stage" hx-sync="this:replace">
        {% include "case_stage.html" with context %}
      </main>
    </div>
  </div>

  <script>
    function toggleSidebar() {
      const sb = document.getElementById("cohort-sidebar");
      const trig = document.getElementById("cohort-open-trigger");
      if (!sb) return;
      const isCollapsed = sb.classList.toggle("collapsed");
      if (trig) trig.style.display = isCollapsed ? "flex" : "none";
    }

    function toggleDiagnosticIsland() {
      const island = document.getElementById("diagnostic-drawer");
      if (!island) return;
      island.classList.toggle("collapsed");
    }

    // Move Cohort Selection Highlight & Keep Controls in Sync
    window.updateActiveCaseHighlight = function(caseId) {
      if (!caseId) return;

      let activeCard = null;
      document.querySelectorAll(".cohort-card").forEach(function(card) {
        const isMatch = (card.getAttribute("data-case-id") === caseId);
        if (isMatch) {
          card.classList.add("active");
          card.setAttribute("aria-pressed", "true");
          card.setAttribute("aria-selected", "true");
          activeCard = card;
        } else {
          card.classList.remove("active");
          card.setAttribute("aria-pressed", "false");
          card.setAttribute("aria-selected", "false");
        }
      });

      // If active card is filtered out by tab, auto-switch to appropriate tab
      if (activeCard && typeof window.switchCohortTab === "function") {
        const organ = activeCard.getAttribute("data-organ");
        const modality = activeCard.getAttribute("data-modality");
        const isHidden = (window.getComputedStyle(activeCard).display === "none");
        if (isHidden) {
          let tabKey = "all";
          if (organ === "brain") tabKey = "brain";
          else if (organ === "breast") tabKey = "breast";
          else if (organ === "prostate") tabKey = "prostate";
          else if (modality === "3d_ct" || ["spleen", "colon", "liver", "pancreas", "lung", "pan_body"].includes(organ)) tabKey = "ct";

          const tabBtn = document.getElementById("tab-btn-" + tabKey);
          window.switchCohortTab(tabKey, tabBtn);
        }

        try {
          activeCard.scrollIntoView({ behavior: "smooth", block: "nearest" });
        } catch(e) {}
      }

      // Synchronize study select dropdowns
      const qSelect = document.getElementById("quick-study-select");
      if (qSelect && qSelect.value !== caseId) qSelect.value = caseId;
      const dSelect = document.getElementById("dossier-quick-study-select");
      if (dSelect && dSelect.value !== caseId) dSelect.value = caseId;
    };

    // A replaced viewer must not leave playback or WebGL callbacks running.
    window.cleanupCaseViewer = function() {
      if (window.cineInterval != null) clearInterval(window.cineInterval);
      window.cineInterval = null;
      window.isCinePlaying = false;
      const cineButton = document.getElementById("btn-cine-play");
      if (cineButton) {
        cineButton.classList.remove("active");
        cineButton.innerText = "Cine Play";
      }
      if (typeof window.cleanup3DTumorPlot === "function") window.cleanup3DTumorPlot();
    };
    document.addEventListener("htmx:beforeSwap", function(evt) {
      if (evt.detail.target?.id === "main-stage" && evt.detail.shouldSwap !== false) {
        window.cleanupCaseViewer();
      }
    });

    // Keep the study visible on compact screens; the header opens the drawer.
    window.closeCompactCohorts = function() {
      if (!window.matchMedia("(max-width: 1100px)").matches) return;
      document.getElementById("cohort-sidebar")?.classList.add("collapsed");
      const trigger = document.getElementById("cohort-open-trigger");
      if (trigger) trigger.style.display = "flex";
    };
    window.closeCompactCohorts();

    // Client-side Study Switcher
    window.loadStudyCase = function(caseId) {
      if (!caseId) return;
      window.cleanupCaseViewer();
      window.closeCompactCohorts();
      window.updateActiveCaseHighlight(caseId);
      if (window.htmx) {
        const request = htmx.ajax("GET", "/cases/" + caseId, {
          source: document.getElementById("main-stage"),
          target: "#main-stage",
          swap: "innerHTML"
        });
        // hx-sync cancels superseded selections; HTMX reports HTTP failures
        // through responseError, so consume the cancellation rejection here.
        if (request && typeof request.catch === "function") request.catch(function() {});
      }
    };

    // HTMX SPA Script Execution & 3D Voxel Re-Initialization Hook
    document.addEventListener("htmx:afterSettle", function(evt) {
      const target = evt.detail.target;
      if (!target) return;

      // Synchronize selection highlight with loaded case stage
      const viewer = document.getElementById("case-viewer-container");
      if (viewer) {
        const currentId = viewer.getAttribute("data-current-case-id");
        if (currentId && typeof window.updateActiveCaseHighlight === "function") {
          window.updateActiveCaseHighlight(currentId);
        }
      }

      const drawer = document.getElementById("diagnostic-drawer");
      if (target.id === "main-stage" && drawer && window.matchMedia("(max-width: 1200px)").matches) {
        drawer.classList.add("collapsed");
      }

      // If a diagnostic dossier with 3D container was swapped into DOM, ensure 3D voxel plot mounts cleanly
      if (document.getElementById("three-tumor-container") && typeof window.init3DTumorPlot === "function") {
        setTimeout(() => {
          window.init3DTumorPlot(true);
        }, 60);
      }
    });
  </script>
<div id="request-status" role="alert" style="position:fixed;bottom:22px;left:20px;right:20px;z-index:1000;padding:14px;background:#172535;border:1px solid #577b93;border-radius:8px;display:none"></div>
<script>
document.body.addEventListener('htmx:responseError',function(e){
 var message='The request failed. Please check the data or model configuration.';
 try{message=JSON.parse(e.detail.xhr.responseText).detail||message;}catch(_){}
 var status=document.getElementById('request-status');status.textContent=typeof message==='string'?message:'Check the request and try again.';status.style.display='block';
 clearTimeout(window.requestStatusTimer);window.requestStatusTimer=setTimeout(function(){status.style.display='none'},10000);
});
</script>
</body>
</html>
