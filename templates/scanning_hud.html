<div class="case-viewer-container" id="case-viewer-container">
  <div class="canvas-hud-top"><div class="hud-pill"><span class="label">Study</span><span class="val">{{ case.name }}</span></div></div>
  <div class="viewer-canvas-area">
    <div class="dicom-image-wrapper"><img id="dicom-slice-img" class="dicom-slice-img"
      src="/cases/{{ case.case_id }}/slice?plane=axial&index={{ case.initial_slice }}&overlay=0" alt="Current volume slice"></div>
    <div class="scanning-overlay"><div class="scanning-status-card" role="status" aria-live="polite">
      <span class="workspace-eyebrow">SEGMENTATION</span>
      <div class="scanning-title-group"><div class="pulse-spinner" aria-hidden="true"></div><h2 class="scanning-title">Running {{ model_name }}</h2></div>
      <p class="library-summary">Processing the volume. Results will appear when inference finishes.</p>
    </div></div>
  </div>
  <div hx-get="/cases/{{ case.case_id }}/scan-status?model_type={{ model_type }}" hx-trigger="load delay:100ms"
       hx-target="#main-stage" hx-swap="innerHTML" hx-request='{"timeout":600000}'></div>
</div>
